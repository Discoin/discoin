version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nx:
        patterns:
          - nx
          - "@nx/*"
  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
