services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discoin}
      POSTGRES_USER: ${POSTGRES_USER:-discoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discoin}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discoin}:${POSTGRES_PASSWORD:-discoin}@db:5432/${POSTGRES_DB:-discoin}
      FIRST_ADMIN_IDS: ${FIRST_ADMIN_IDS:?Set FIRST_ADMIN_IDS in .env to the Discord user IDs of the first admins, comma separated}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in .env from the Discord developer portal}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET in .env from the Discord developer portal}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?Set DISCORD_REDIRECT_URI in .env to the API login callback URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env to where the dashboard is served}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY in .env to 32 random bytes in base64}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: ./apps/api
    command:
      - /app/.venv/bin/python
      - -m
      - app.webhooks.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discoin}:${POSTGRES_PASSWORD:-discoin}@db:5432/${POSTGRES_DB:-discoin}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY in .env to 32 random bytes in base64}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4080:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
