[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary,pool]>=3.3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
