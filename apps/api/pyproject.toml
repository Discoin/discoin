[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary,pool]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
